  <!-- eyes, traced from the exact positions in the source artwork -->
  <circle class="stroke-el" id="p-eye-l" cx="484" cy="623" r="19"/>
  <circle class="stroke-el" id="p-eye-r" cx="626.1" cy="602.9" r="44.7"/>

  <circle class="fill-eye" id="f-eye-l" cx="484" cy="623" r="19"/>
  <circle class="fill-eye" id="f-eye-r" cx="626.1" cy="602.9" r="44.7"/>

  <circle class="highlight" id="h-eye-l" cx="472.6" cy="601.3" r="5.5"/>
  <circle class="highlight" id="h-eye-r" cx="608" cy="583" r="10.2"/>

  <script><![CDATA[
  (function(){
    var root = document.getElementById('mascot-svg');
    var doc = root.ownerDocument;

    var linesEl   = doc.getElementById('p-lines');
    var eyeL      = doc.getElementById('p-eye-l');
    var eyeR      = doc.getElementById('p-eye-r');
    var fillEyeL  = doc.getElementById('f-eye-l');
    var fillEyeR  = doc.getElementById('f-eye-r');
    var hL        = doc.getElementById('h-eye-l');
    var hR        = doc.getElementById('h-eye-r');

    var LINES_DUR = 2600;   // ms, main line trace
    var EYE_DUR = 220;      // ms, each eye's outline
    var EYE_START = LINES_DUR * 0.55; // eyes start partway through the line draw
    var EYE_STAGGER = 90;   // ms between the two eyes starting

    function prepare(){
      var timeline = [];

      var linesLen = linesEl.getTotalLength();
      linesEl.style.strokeDasharray = linesLen;
      linesEl.style.strokeDashoffset = linesLen;
      linesEl.style.transition = 'none';
      timeline.push({ el: linesEl, dur: LINES_DUR, start: 0 });

      var eyeFinish = {};
      [['p-eye-l', eyeL], ['p-eye-r', eyeR]].forEach(function(pair, i){
        var id = pair[0], el = pair[1];
        var len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        el.style.transition = 'none';
        var start = EYE_START + i * EYE_STAGGER;
        timeline.push({ el: el, dur: EYE_DUR, start: start });
        eyeFinish[id] = start + EYE_DUR;
      });

      var total = Math.max(LINES_DUR, eyeFinish['p-eye-l'], eyeFinish['p-eye-r']);
      return { timeline: timeline, total: total, eyeFinish: eyeFinish };
    }

    function reset(){
      fillEyeL.classList.remove('show');
      fillEyeR.classList.remove('show');
      hL.classList.remove('show');
      hR.classList.remove('show');
    }

    function playMascotAnimation(){
      reset();
      var setup = prepare();
      void root.getBoundingClientRect(); // force reflow before enabling transitions

      setup.timeline.forEach(function(item){
        setTimeout(function(){
          item.el.style.transition = 'stroke-dashoffset ' + item.dur + 'ms cubic-bezier(.65,.05,.36,1)';
          item.el.style.strokeDashoffset = '0';
        }, Math.max(0, item.start));
      });

      setTimeout(function(){ fillEyeL.classList.add('show'); }, setup.eyeFinish['p-eye-l'] - 10);
      setTimeout(function(){ fillEyeR.classList.add('show'); }, setup.eyeFinish['p-eye-r'] - 10);
      setTimeout(function(){ hL.classList.add('show'); }, setup.eyeFinish['p-eye-l'] + 130);
      setTimeout(function(){ hR.classList.add('show'); }, setup.eyeFinish['p-eye-r'] + 130);
    }

    // expose so the host page can trigger replays: document.getElementById('mascot-svg').contentWindow?.playMascotAnimation?.()
    // or, if inlined directly in the page, just call window.playMascotAnimation()
    window.playMascotAnimation = playMascotAnimation;

    playMascotAnimation();
  })();
  ]]></script>
</svg>
