<svg viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg" id="mascot-svg" width="1254" height="1254" overflow="visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    #mascot-svg {
      --ink: #16302e;
      --bg: #dfe9e8;
    }
    #p-lines {
      fill: none;
      stroke: var(--ink);
      stroke-width: 120;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .stroke-el {
      fill: none;
      stroke: var(--ink);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fill-eye {
      fill: var(--ink);
      opacity: 0;
      transition: opacity .18s ease;
    }
    .fill-eye.show { opacity: 1; }
    .highlight {
      fill: var(--bg);
      opacity: 0;
      transition: opacity .18s ease;
    }
    .highlight.show { opacity: 1; }
  </style>

